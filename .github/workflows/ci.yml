name: ci

# Complements the professor's code-quality workflow (build.yml, unchanged) with the project gates:
# containerized verification + 95 % coverage, a test matrix across operating systems and image builds.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify (containerized build, format, coverage gate, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}

      - name: Verify
        run: make verify

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: warn
          retention-days: 30

  test-matrix:
    name: ${{ matrix.suite }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [ExpenseHub.UnitTests, ExpenseHub.IntegrationTests]
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: bash
        run: dotnet test "sources/${{ matrix.suite }}/${{ matrix.suite }}.csproj" --logger "trx;LogFileName=${{ matrix.suite }}.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build web image
        run: docker build -f sources/ExpenseHub.Api/Dockerfile -t expensehub-api:ci .
