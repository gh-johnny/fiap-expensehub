name: release

# Publishes the web and worker images to GHCR, identified by the full commit SHA, only after the same
# gate as the CI (make verify) passes. Each image ships a provenance attestation and an SBOM, and is
# scanned by Trivy: a fixable CRITICAL vulnerability fails the job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gh-johnny/fiap-expensehub
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  verify:
    name: make verify (gate before publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}

      - name: Verify
        run: make verify

  publish:
    name: Publish ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: sources/ExpenseHub.Api/Dockerfile
          - image: worker
            dockerfile: sources/ExpenseHub.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:main

      - name: Scan with Trivy (fail on fixable CRITICAL)
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          mkdir -p artifacts/trivy
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD/artifacts/trivy":/out "$TRIVY_IMAGE" \
            image --quiet --ignore-unfixed --severity HIGH,CRITICAL --format table \
            --output "/out/${{ matrix.image }}.txt" "$IMAGE_REF"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" \
            image --quiet --ignore-unfixed --severity CRITICAL --exit-code 1 "$IMAGE_REF"

      - name: Write the image reference to the job summary
        if: always()
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.image }} image"
            echo
            echo "| Reference | Value |"
            echo "|---|---|"
            echo "| Tag (commit) | \`$IMAGE:${{ github.sha }}\` |"
            echo "| Digest | \`$IMAGE@$DIGEST\` |"
            echo "| IMAGE_TAG for compose.release.yaml | \`${{ github.sha }}\` |"
            echo
            if [ -f "artifacts/trivy/${{ matrix.image }}.txt" ]; then
              echo "<details><summary>Trivy — fixable HIGH/CRITICAL</summary>"
              echo
              echo '```text'
              cat "artifacts/trivy/${{ matrix.image }}.txt"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}
          path: artifacts/trivy/
          if-no-files-found: warn
          retention-days: 30
